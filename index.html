<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STEPS — Todo lo que necesitás en una sola plataforma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0D0D0D; --gold: #E8A020; --gold-dim: #7A540E;
      --white: #F0EFED; --muted: #888780; --border: #222220; --surface: #141414;
      --green: #3DBA6F; --blue: #5BB8F6;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'Inter', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg); color: var(--white);
      font-family: var(--font-body); font-weight: 300;
      line-height: 1.6; -webkit-font-smoothing: antialiased; overflow-x: hidden;
    }

    /* ── CANVAS FONDO 3D ── */
    #bg-canvas {
      position: fixed; top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0; pointer-events: none;
    }

    /* ── NAVBAR ── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 1.25rem 3rem;
      border-bottom: 1px solid transparent;
      transition: border-color .4s, background .4s;
    }
    nav.scrolled {
      background: rgba(13,13,13,.92); border-color: var(--border);
      backdrop-filter: blur(12px);
    }
    .nav-logo {
      font-family: var(--font-display); font-size: 1.6rem; letter-spacing: .12em;
      color: var(--white); text-decoration: none;
      display: flex; align-items: center; gap: .5rem;
    }
    .nav-logo-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); margin-bottom: 2px; }
    .nav-links { display: flex; align-items: center; gap: 2.5rem; list-style: none; }
    .nav-links a { font-size: .78rem; font-weight: 500; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-decoration: none; transition: color .2s; }
    .nav-links a:hover { color: var(--white); }
    .nav-cta { color: var(--gold) !important; border: 1px solid var(--gold-dim); padding: .45rem 1.2rem; border-radius: 2px; transition: background .2s !important; }
    .nav-cta:hover { background: var(--gold); color: var(--bg) !important; }

    /* ── HERO ── */
    #hero {
      position: relative; z-index: 1;
      min-height: 100svh;
      display: flex; flex-direction: column; justify-content: center;
      padding: 6rem 4rem 5rem;
    }
    .weld-line {
      position: absolute; top: 0; left: 0; height: 2px; width: 0;
      background: var(--gold); box-shadow: 0 0 16px var(--gold);
      animation: weld 1.6s cubic-bezier(.22,1,.36,1) .3s forwards;
    }
    @keyframes weld { to { width: 100%; } }

    .hero-inner {
      max-width: 820px;
      opacity: 0; transform: translateY(20px);
      animation: rise 1s cubic-bezier(.22,1,.36,1) .4s forwards;
    }
    @keyframes rise { to { opacity: 1; transform: none; } }

    /* Headline */
    h1 {
      font-family: var(--font-display);
      font-size: clamp(3.2rem, 7.5vw, 7rem);
      line-height: .93; letter-spacing: .01em;
      color: var(--white); margin-bottom: 2.8rem;
    }

    /* PLATAFORMA — dorado 3D con textura de universo naranja */
    .hl-plataforma {
      position: relative;
      display: inline-block;
      /* Gradiente 3D: luz frontal dorada, sombras laterales naranjas profundas */
      background: linear-gradient(
        160deg,
        #7A3800 0%,
        #C06000 12%,
        #E8900A 24%,
        #FFD060 38%,
        #FFF4C0 46%,
        #FFBA30 54%,
        #E8900A 66%,
        #B85500 80%,
        #6A2E00 100%
      );
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      /* Sombra que da profundidad 3D */
      filter: drop-shadow(2px 3px 0px rgba(80,30,0,.7))
              drop-shadow(0 0 22px rgba(220,120,0,.35));
      animation: plat-breathe 5s ease-in-out infinite;
    }
    @keyframes plat-breathe {
      0%,100% { filter: drop-shadow(2px 3px 0px rgba(80,30,0,.7)) drop-shadow(0 0 22px rgba(220,120,0,.35)); }
      50%      { filter: drop-shadow(2px 3px 0px rgba(80,30,0,.8)) drop-shadow(0 0 36px rgba(255,160,20,.5)); }
    }

    /* Puntitos estrellas sobre PLATAFORMA */
    #star-word-canvas {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none; z-index: 2;
    }

    

    /* Palabra ECOSISTEMA en hero */
    

    /* Grid divisiones */
    .divisions-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
    }
    .division-card {
      background: rgba(13,13,13,.92);
      padding: 2.8rem 2.2rem 2.4rem;
      transition: background .3s;
      backdrop-filter: blur(4px);
    }
    .division-card:hover { background: rgba(20,20,20,.97); }

    .division-number {
      font-family: var(--font-display);
      font-size: 3.5rem; line-height: 1;
      margin-bottom: 1.2rem;
      color: var(--border);
    }
    .division-tag {
      font-size: .68rem; font-weight: 600;
      letter-spacing: .14em; text-transform: uppercase;
      margin-bottom: .6rem;
    }
    .division-tag.orange { color: var(--gold); }
    .division-tag.green  { color: var(--green); }
    .division-tag.blue   { color: var(--blue); }

    .division-name {
      font-family: var(--font-display);
      font-size: 1.5rem; letter-spacing: .04em;
      color: var(--white); margin-bottom: .8rem; line-height: 1.1;
    }
    .division-desc {
      font-size: .84rem; font-weight: 300;
      color: var(--muted); line-height: 1.7;
    }

    /* ── SECTORES ── */
    #sectores {
      position: relative; z-index: 1;
      padding: 6rem 4rem; background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .sectors-grid {
      display: grid; grid-template-columns: repeat(4,1fr);
      gap: 1px; background: var(--border);
      border: 1px solid var(--border); margin-top: 2.5rem;
    }
    .sector-card {
      background: var(--bg); padding: 2rem 1.5rem;
      transition: background .25s;
      display: flex; flex-direction: column; gap: .6rem;
    }
    .sector-card:hover { background: var(--surface); }
    .sector-icon { font-size: 1.4rem; line-height: 1; }
    .sector-name { font-family: var(--font-display); font-size: 1.15rem; letter-spacing: .04em; color: var(--white); }
    .sector-desc { font-size: .78rem; color: var(--muted); font-weight: 300; line-height: 1.6; }

    /* ── CTA FINAL ── */
    #cta-final {
      position: relative; z-index: 1;
      padding: 7rem 4rem; background: var(--bg);
      border-top: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center; gap: 2rem; text-align: center;
    }
    .cta-eyebrow { font-size: .72rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); }
    .btn-primary {
      display: inline-block; background: var(--gold); color: var(--bg);
      font-size: .82rem; font-weight: 600; letter-spacing: .06em;
      text-transform: uppercase; text-decoration: none;
      padding: .9rem 2.4rem; border-radius: 2px; border: 1px solid var(--gold);
      transition: background .2s, transform .15s;
    }
    .btn-primary:hover { background: #f0aa28; transform: translateY(-1px); }

    /* ── RESPONSIVE ── */
    @media (max-width: 900px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      #hero { padding: 5rem 1.5rem 4rem; }
      .scroll-cue { display: none; }
      #divisiones, #sectores, #cta-final { padding: 4rem 1.5rem; }
      .divisions-grid { grid-template-columns: 1fr; }
      .sectors-grid { grid-template-columns: repeat(2,1fr); }
    }
    @media (prefers-reduced-motion: reduce) {
      .weld-line { animation: none; width: 100%; }
      .hero-inner { animation: none; opacity: 1; transform: none; }
      .hl-plataforma { animation: none; }
    }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>
<!-- NAVBAR -->
<nav id="navbar">
  <a href="/" class="nav-logo">STEPS <span class="nav-logo-dot"></span></a>
  <ul class="nav-links">
    <li><a href="ecosistema.html">Ecosistema</a></li>
    <li><a href="supply.html">Catálogo</a></li>
    <li><a href="#acceso" class="nav-cta">Solicitar acceso</a></li>
  </ul>
</nav>

<!-- HERO -->
<section id="hero">
  <div class="weld-line"></div>
  <div class="hero-inner">
    <h1>
      TODO LO QUE<br>
      NECESITÁS EN<br>
      UNA SOLA<br>
      <span class="hl-plataforma" id="word-plataforma">PLATAFORMA<canvas id="star-word-canvas"></canvas></span>
    </h1>
    <a href="#cta-final" class="btn-access"><span>Solicitar acceso</span></a>
  </div>
  <div class="scroll-cue">
    <span>Scroll</span>
    <div class="scroll-cue-line"></div>
  </div>
</section>



<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ══════════════════════════════════════════
//  1. FONDO 3D
// ══════════════════════════════════════════
(function(){
  const canvas = document.getElementById('bg-canvas');
  const scene  = new THREE.Scene();
  const cam    = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, .1, 2000);
  cam.position.z = 400;
  const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x0D0D0D, 1);

  // Estrellas
  const sg = new THREE.BufferGeometry();
  const sp = new Float32Array(1800*3);
  for(let i=0;i<1800;i++){sp[i*3]=(Math.random()-.5)*1400;sp[i*3+1]=(Math.random()-.5)*900;sp[i*3+2]=(Math.random()-.5)*600-100;}
  sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  scene.add(new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:1.1,transparent:true,opacity:.5})));

  // Nodos dorados
  const nc=100, ng=new THREE.BufferGeometry(), np=new Float32Array(nc*3), nv=[];
  for(let i=0;i<nc;i++){np[i*3]=(Math.random()-.5)*900;np[i*3+1]=(Math.random()-.5)*600;np[i*3+2]=(Math.random()-.5)*200;nv.push({x:(Math.random()-.5)*.18,y:(Math.random()-.5)*.12,z:(Math.random()-.5)*.06});}
  ng.setAttribute('position',new THREE.BufferAttribute(np,3));
  scene.add(new THREE.Points(ng,new THREE.PointsMaterial({color:0xE8A020,size:2.2,transparent:true,opacity:.7})));

  let lm=null;
  function bl(){
    if(lm){scene.remove(lm);lm.geometry.dispose();}
    const pos=[],col=[],p=ng.attributes.position.array;
    for(let i=0;i<nc;i++) for(let j=i+1;j<nc;j++){
      const dx=p[i*3]-p[j*3],dy=p[i*3+1]-p[j*3+1],dz=p[i*3+2]-p[j*3+2];
      const d=Math.sqrt(dx*dx+dy*dy+dz*dz);
      if(d<140){const a=1-d/140;pos.push(p[i*3],p[i*3+1],p[i*3+2],p[j*3],p[j*3+1],p[j*3+2]);col.push(.91*a,.63*a,.13*a,.91*a,.63*a,.13*a);}
    }
    const geo=new THREE.BufferGeometry();
    geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(pos),3));
    geo.setAttribute('color',new THREE.BufferAttribute(new Float32Array(col),3));
    lm=new THREE.LineSegments(geo,new THREE.LineBasicMaterial({vertexColors:true,transparent:true,opacity:.4}));
    scene.add(lm);
  }
  bl();

  const mouse={x:0,y:0},tgt={x:0,y:0};
  window.addEventListener('mousemove',e=>{mouse.x=(e.clientX/innerWidth-.5)*2;mouse.y=(e.clientY/innerHeight-.5)*2;},{passive:true});
  let sy=0; window.addEventListener('scroll',()=>{sy=scrollY;},{passive:true});
  window.addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

  let fr=0,lt=0;
  (function anim(){
    requestAnimationFrame(anim); fr++;
    tgt.x+=(mouse.x*18-tgt.x)*.04; tgt.y+=(-mouse.y*12-tgt.y)*.04;
    cam.position.x+=(tgt.x-cam.position.x)*.06;
    cam.position.y+=(tgt.y-cam.position.y)*.06;
    cam.position.y-=sy*.03; cam.lookAt(scene.position);
    const p=ng.attributes.position.array;
    for(let i=0;i<nc;i++){p[i*3]+=nv[i].x;p[i*3+1]+=nv[i].y;p[i*3+2]+=nv[i].z;if(Math.abs(p[i*3])>450)nv[i].x*=-1;if(Math.abs(p[i*3+1])>300)nv[i].y*=-1;if(Math.abs(p[i*3+2])>100)nv[i].z*=-1;}
    ng.attributes.position.needsUpdate=true;
    lt++; if(lt%3===0) bl();
    scene.rotation.y=fr*.00015; scene.rotation.x=fr*.00008;
    renderer.render(scene,cam);
  })();
})();

// ══════════════════════════════════════════
//  2. ESTRELLAS SOBRE PLATAFORMA
// ══════════════════════════════════════════
(function(){
  const wordEl=document.getElementById('word-plataforma');
  const c=document.getElementById('star-word-canvas');
  const ctx=c.getContext('2d');
  let stars=[],W,H;

  function init(){
    const r=wordEl.getBoundingClientRect();
    W=c.width=Math.ceil(r.width); H=c.height=Math.ceil(r.height);
    stars=[];
    const count=Math.floor(W*H/220);
    for(let i=0;i<count;i++) stars.push({
      x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.2+.3,
      speed:Math.random()*1.8+.6,
      phase:Math.random()*Math.PI*2
    });
  }

  let t=0;
  (function loop(){
    requestAnimationFrame(loop); t+=.016;
    ctx.clearRect(0,0,W,H);
    stars.forEach(s=>{
      const a=.25+.75*(.5+.5*Math.sin(t*s.speed+s.phase));
      ctx.save();
      ctx.globalAlpha=a*.8;
      ctx.shadowColor='#FFCC66'; ctx.shadowBlur=5;
      ctx.fillStyle='#FFFFFF';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      ctx.restore();
    });
  })();

  setTimeout(init,700);
  window.addEventListener('resize',()=>setTimeout(init,120));
})();



// ── Navbar ──
const nav=document.getElementById('navbar');
window.addEventListener('scroll',()=>{nav.classList.toggle('scrolled',scrollY>40);},{passive:true});
</script>
</body>
</html>
